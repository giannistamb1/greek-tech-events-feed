# =====================================================================
#  Greek Tech Events feed — source list
#  After any change run:  python build_feed.py --check
#  Sources marked "verify" use URL patterns that sites change often.
#  If --check shows an error, open the site, find the current listing
#  URL (or its RSS/iCal link) and paste it in.
# =====================================================================

feed:
  title: "Greek Tech Events & Meetups"
  description: "Tech, startup, AI, developer and innovation events across Greece, merged from event platforms, community calendars and Greek tech media."
  link: "https://giannistamb1.github.io/greek-tech-events-feed/feed.xml"
  home: "https://giannistamb1.github.io/greek-tech-events-feed/"

settings:
  timeout: 30
  max_items: 600
  max_news_age_days: 45

# Patterns are regular expressions matched against lowercased text with
# Greek accents removed and ς turned into σ. So write Greek without tonos
# and with σ (e.g. "συνεδρι" matches "Συνέδριο", "συνεδρίου").
keywords:
  tech:
    - '\bai\b'
    - 'artificial intelligence|τεχνητη νοημοσυνη'
    - 'machine learning|μηχανικη μαθηση|\bml\b|\bllms?\b|genai|generative'
    - 'tech|τεχνολογ'
    - 'start-?ups?|νεοφυ'
    - 'founder|ιδρυτ|entrepreneur|επιχειρηματικοτητ'
    - 'develop|προγραμματισ|coding|software|λογισμικ'
    - 'javascript|typescript|python|\bjava\b|rust|golang|react|kotlin|\.net|php|flutter'
    - 'cloud|kubernetes|devops|aws|azure|gcp|open source'
    - '\bdata\b|δεδομεν|analytics'
    - 'cyber|security|infosec|κυβερνοασφαλ'
    - 'blockchain|crypto|web3'
    - 'fintech|proptech|healthtech|edtech|agritech|deeptech|climate ?tech|insurtech|spacetech'
    - 'saas|product manag|\bux\b|\bui\b'
    - 'hackathon|game ?jam|gamedev'
    - 'innovation|καινοτομ|ψηφιακ|digital'
    - 'robot|ρομποτ|\biot\b|embedded|semiconductor|quantum|drone'
    - 'accelerator|incubator|επιταχυντ|θερμοκοιτιδ'
    - 'venture|investor|\bvcs?\b|επενδυτ'
    - 'demo ?day|pitch'
  event:
    - 'event|εκδηλωσ|meetup|meet-up'
    - 'conference|συνεδρι|summit|forum|φορουμ'
    - 'workshop|εργαστηρι|bootcamp|masterclass|training'
    - 'webinar|ημεριδ|παρουσιασ|ομιλι|\btalks?\b|panel'
    - 'hackathon|expo|εκθεσ|festival|φεστιβαλ|\bweek\b'
    - 'demo ?day|pitch|competition|διαγωνισμ|awards|βραβει'
    - 'open call|call for|προσκλησ|applications|αιτησ'
    - 'regist|εγγραφ|tickets|εισιτηρι|networking'
  greece:
    - 'greece|greek|hellenic|ελλαδ|ελληνικ|ελλην'
    - 'athens|αθην|piraeus|πειραι'
    - 'thessaloniki|θεσσαλονικ'
    - 'patras|πατρα\b|πατρων'
    - 'crete|κρητ|heraklion|ηρακλει|chania|χανι'
    - 'ioannina|ιωαννιν|larissa|λαρισ|volos|βολοσ|βολου'
    - 'kalamata|καλαματ|rhodes|ροδου|ροδοσ|corfu|κερκυρ|kavala|καβαλ|syros|συρο'

# ---------------------------------------------------------------------
# Fields:
#   name, url, type (rss|ical|jsonld), kind (events|news), category
#   filter: none|tech|tech_event     require_greece: true|false
#   home: optional public page shown as the item's source link
#   enabled: false to switch a source off
# ---------------------------------------------------------------------
sources:

  # ===== EVENT PLATFORMS (very high / high) ==========================

  - name: Meetup — Athens tech
    url: https://www.meetup.com/find/?location=gr--Athens&source=EVENTS&categoryId=546
    type: jsonld          # verify
    kind: events
    category: Meetup
    filter: none

  - name: Meetup — Thessaloniki tech
    url: https://www.meetup.com/find/?location=gr--Thessaloniki&source=EVENTS&categoryId=546
    type: jsonld          # verify
    kind: events
    category: Meetup
    filter: none

  # Most reliable Meetup method: one iCal per group you care about.
  # On any group page the URL is meetup.com/<group-name>/ → use:
  #   https://www.meetup.com/<group-name>/events/ical/
  # Copy this block once per group (Athens JS, Python, AI, Data, UX,
  # cybersecurity, Open Coffee Greece, GDG, AWS user groups, etc.).
  - name: Meetup group — TEMPLATE
    url: https://www.meetup.com/REPLACE-GROUP-NAME/events/ical/
    type: ical
    kind: events
    category: Meetup
    filter: none
    enabled: false

  - name: Eventbrite — Greece science & tech
    url: https://www.eventbrite.com/d/greece/science-and-tech--events/
    type: jsonld          # verify
    kind: events
    category: Eventbrite
    filter: none

  - name: Eventbrite — Greece business (tech-filtered)
    url: https://www.eventbrite.com/d/greece/business--events/
    type: jsonld          # verify
    kind: events
    category: Eventbrite
    filter: tech

  - name: Eventbrite — Athens startups
    url: https://www.eventbrite.com/d/greece--athens/startup/
    type: jsonld          # verify
    kind: events
    category: Eventbrite
    filter: tech

  - name: Luma — Athens
    url: https://lu.ma/athens
    type: jsonld          # verify
    kind: events
    category: Luma
    filter: tech
    enabled: false        # 2026-10-08: page has no schema.org data; use per-calendar iCal below

  # Luma calendars (community/organiser pages) have an iCal subscribe link:
  # on the calendar page click "Subscribe" → copy the iCal URL here.
  - name: Luma calendar — TEMPLATE
    url: https://api.lu.ma/ics/get?entity=calendar&id=REPLACE-CAL-ID
    type: ical
    kind: events
    category: Luma
    filter: none
    enabled: false

  # ===== AGGREGATORS (medium) ========================================

  - name: AllEvents — Athens tech
    url: https://allevents.in/athens/tech
    type: jsonld
    kind: events
    category: Aggregator
    filter: tech
    enabled: false        # 2026-10-08: listing page no longer embeds schema.org Event data

  - name: AllEvents — Thessaloniki tech
